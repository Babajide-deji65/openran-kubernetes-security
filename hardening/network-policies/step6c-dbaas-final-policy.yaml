apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dbaas-approved-consumers
  namespace: ricplt
spec:
  podSelector:
    matchLabels:
      app: ricplt-dbaas
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ricplt-a1mediator
          - ricplt-alarmmanager
          - ricplt-appmgr
          - ricplt-e2mgr
          - ricplt-o1mediator
          - ricplt-rtmgr
          - ricplt-submgr
    ports:
    - protocol: TCP
      port: 6379
